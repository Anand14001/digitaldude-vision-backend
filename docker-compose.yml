services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-dude-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_local_password
      POSTGRES_DB: digital_dude_crm
    ports:
      - "5433:5432"
    volumes:
      - dd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d digital_dude_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dd_pgdata:
